schema_version: '1.1'
name: wayfinder-neighbour-quiet
description: Plain words about mapping an idea, the phrasing of mattpocock-skills:wayfinder, leave the user-invoked forge-sdlc:wayfinder unrun
tags: [triggering]
plugins: ['../../..']
runs: 2
expected_outcome: No forge-sdlc:wayfinder call, no forge script run, no effort folder
context:
  scaffold_script: fixture.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: 'I have a fuzzy idea: let writers export word counts as CSV. Before anyone builds it, help me map what we do not know yet.'
