schema_version: '1.1'
name: help-fires
description: /forge-sdlc:help points at the /forge panel in one line and lists no command or agent itself
tags: [triggering]
plugins: ['../../..']
runs: 2
expected_outcome: One line naming /forge; no listing of the plugin's commands or agents
context:
  scaffold_script: fixture.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 4
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: '/forge-sdlc:help'
