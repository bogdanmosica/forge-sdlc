schema_version: '1.1'
name: init-builtin-quiet
description: The built-in /init, the neighbour of /forge-sdlc:init, leaves forge-sdlc's init unrun
tags: [triggering]
plugins: ['../../..']
runs: 2
expected_outcome: The built-in init runs; nothing names Matt's setup or docs/agents/forge.md
context:
  scaffold_script: fixture.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: '/init'
