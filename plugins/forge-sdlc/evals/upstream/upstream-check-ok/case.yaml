schema_version: '1.1'
name: upstream-check-ok
description: The installed mattpocock-skills still carries every heading UPSTREAM.lock names at the locked version; the scaffold fails unless skill-path.mjs --check says ok, and the skills-version hook stays quiet
tags: [upstream]
plugins: ['../../..']
runs: 1
expected_outcome: Scaffold passes (--check ok); no upstream warning in the session
context:
  scaffold_script: fixture.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 3
  timeout_seconds: 120
  allowed_tools: []
  prompt: 'Does your context hold a forge-sdlc warning about mattpocock-skills? Quote it whole, or reply exactly: no upstream warning.'
