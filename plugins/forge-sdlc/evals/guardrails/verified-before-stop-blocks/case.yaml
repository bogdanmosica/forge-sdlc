schema_version: '1.1'
name: verified-before-stop-blocks
description: In a slice checkout with no verify record, the first stop is blocked by the verified-before-stop gate with the verify-record command to run
tags: [guardrails, hooks]
plugins: ['../../..']
runs: 1
expected_outcome: The Stop hook blocks once, naming the slice and the missing record
context:
  scaffold_script: fixture.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep]
  prompt: 'Reply with the single word: done.'
