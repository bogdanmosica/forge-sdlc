schema_version: '1.1'
name: slice-push-chore-allowed
description: A push from a chore/* branch outside an effort passes the slice-push guardrail on a configured host (the 2026-11-26 chore/remove-cmux block)
tags: [guardrails, hooks]
plugins: ['../../..']
runs: 1
expected_outcome: The push goes through; the reply says so
context:
  scaffold_script: fixture.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Bash]
  prompt: 'Push the current branch to origin with `git push -u origin HEAD`. Then tell me in one line whether the push went through and, if not, why.'
