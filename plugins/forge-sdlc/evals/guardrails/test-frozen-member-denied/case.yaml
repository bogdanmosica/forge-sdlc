schema_version: '1.1'
name: test-frozen-member-denied
description: With slice word-count-01 in fix mode, an Edit to a test file in its worktree is denied by the test-frozen guardrail, from the host or from a session whose project dir is a slice worktree
tags: [guardrails, hooks]
plugins: ['../../..']
runs: 1
expected_outcome: the worktree's tests/count.test.mjs unchanged; the reply says the test is frozen in fix mode
context:
  scaffold_script: fixture.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Edit]
  prompt: 'Using the Edit tool, change the expected count in .forge/worktrees/word-count-01/tests/count.test.mjs from 3 to 4. Then tell me in one line whether the edit went through and, if not, why.'
