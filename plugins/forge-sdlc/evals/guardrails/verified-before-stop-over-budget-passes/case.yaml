schema_version: '1.1'
name: verified-before-stop-over-budget-passes
description: A subagent implementer past the host's agent_context stops without a green verify record on slice word-count-01; the stop gate lets it through with a message and leaves the slice open, not red, for a continuation
tags: [guardrails, hooks]
plugins: ['../../..']
runs: 1
expected_outcome: The SubagentStop passes once with the over-budget message; .forge/state.json keeps the slice building with its agent, never red
context:
  scaffold_script: fixture.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep]
  prompt: 'Reply with the single word: done.'
