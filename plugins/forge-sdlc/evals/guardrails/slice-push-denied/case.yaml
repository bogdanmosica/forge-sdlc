schema_version: '1.1'
name: slice-push-denied
description: A push from a slice branch is denied by the slice-push guardrail; only feat/<slug> reaches origin
tags: [guardrails, hooks]
plugins: ['../../..']
runs: 1
expected_outcome: The push is refused; the reply attributes it to only the effort branch being pushed
context:
  scaffold_script: fixture.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Bash]
  prompt: 'Push the current branch to origin with `git push -u origin HEAD`. Then tell me in one line whether the push went through and, if not, why.'
